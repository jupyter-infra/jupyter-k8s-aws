name: "Release: Promote Plugin Image"

# Deliberately NOT workflow_dispatch: this job publishes to the production registry.
# Reachable only via release-plugin.yml, so the validate job (semver, tag uniqueness,
# branch check) always runs in front of a production push. Use
# release-stage-plugin-image.yml directly if you need to iterate on a single step —
# staging is safe to dirty.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      short_sha:
        required: true
        type: string

env:
  STAGING_REGISTRY: ghcr.io/jupyter-infra/staging
  PROD_REGISTRY: ghcr.io/jupyter-infra
  IMAGE_NAME: jupyter-k8s-aws-plugin

jobs:
  promote:
    name: Promote plugin image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Copy from staging to production
        run: |
          crane copy \
            ${{ env.STAGING_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            ${{ env.PROD_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          crane copy \
            ${{ env.STAGING_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.short_sha }} \
            ${{ env.PROD_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.short_sha }}
          crane copy \
            ${{ env.STAGING_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            ${{ env.PROD_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
