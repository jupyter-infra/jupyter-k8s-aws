apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    issuer: https://{{ .Values.domain }}/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
{{- if and .Values.internalTls.enabled .Values.internalTls.dex }}
      # Serve HTTPS to the network, and keep the plaintext listener bound to localhost
      # purely so the probes can reach it. Dex's startupProbe has to parse /dex/keys for
      # a "kid", which needs a shell either way, so probing over localhost costs nothing
      # and leaves no unauthenticated Dex port reachable from the namespace.
      http: 127.0.0.1:5556
      https: 0.0.0.0:5554
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
{{- else }}
      http: 0.0.0.0:5556
{{- end }}
    staticClients:
    - id: {{ .Values.dex.kubernetesClientId }}
      redirectURIs:
      # OAuth2 Proxy web callback
      - https://{{ .Values.domain }}/oauth2/callback
      # kubectl CLI callbacks
      {{- range .Values.dex.kubernetesClientRedirectPorts }}
      - http://localhost:{{ . }}
      {{- end }}
      name: 'OAuth2 Proxy'
      secret: {{ include "defaulter.oauth2ProxyClientSecret" . }}
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: $GITHUB_CLIENT_ID
        clientSecret: $GITHUB_CLIENT_SECRET
        redirectURI: https://{{ .Values.domain }}/dex/callback
        {{- if .Values.github.orgs }}
        orgs:
        {{- range .Values.github.orgs }}
        - name: {{ .name }}
          {{- if .teams }}
          teams:
          {{- range .teams }}
          - {{ . }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
    oauth2:
      skipApprovalScreen: true
      responseTypes: ["code", "token", "id_token"]

    enablePasswordDB: false

    # Enable debug logging
    logger:
      level: debug