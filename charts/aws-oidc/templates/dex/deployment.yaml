apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: {{ .Values.namespace }}
  labels:
    app: dex
    component: oauth
spec:
  replicas: {{ .Values.dex.replicas }}
  selector:
    matchLabels:
      app: dex
      component: oauth
  template:
    metadata:
      labels:
        app: dex
        component: oauth
    spec:
      serviceAccountName: dex
      {{- with .Values.dex.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dex.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-traefik
        image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          echo "Waiting for Traefik service to be available..."
          timeout={{ .Values.dex.traefikCheck.timeout_seconds }}
          counter=0
          interval=5
          until wget -q -O - http://traefik-healthcheck.{{ .Values.namespace }}:9000/ping > /dev/null 2>&1; do
            echo "Traefik service is not yet available, retrying in ${interval}s... (${counter}/${timeout}s)"
            sleep $interval
            counter=$((counter + interval))
            if [ $counter -ge $timeout ]; then
              echo "Timeout after ${timeout}s waiting for Traefik service. Continuing anyway..."
              break
            fi
          done
          echo "Traefik service is available!"

          echo "Waiting for TLS certificate to be ready..."
          APISERVER=https://kubernetes.default.svc
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          NAMESPACE={{ .Values.namespace }}
          timeout={{ .Values.dex.certCheck.timeout_seconds }}
          counter=0
          while true; do
            RESP=$(wget -q --no-check-certificate --header="Authorization: Bearer $TOKEN" \
              -O - "$APISERVER/apis/cert-manager.io/v1/namespaces/$NAMESPACE/certificates/traefik-cert" 2>/dev/null || true)
            if echo "$RESP" | grep -q '"reason": "Ready"'; then break; fi
            echo "TLS certificate is not yet ready, retrying in ${interval}s... (${counter}/${timeout}s)"
            sleep $interval
            counter=$((counter + interval))
            if [ $counter -ge $timeout ]; then
              echo "Timeout after ${timeout}s waiting for TLS certificate. Continuing anyway..."
              break
            fi
          done
          echo "TLS certificate is ready!"
      containers:
      - name: dex
        image: {{ .Values.dex.repository }}:{{ .Values.dex.imageTag }}
        command: ["/usr/local/bin/dex", "serve", "/etc/dex/config/config.yaml"]
        env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: github-client
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-client
              key: client-secret
        ports:
{{- if and .Values.internalTls.enabled .Values.internalTls.dex }}
        - name: https
          containerPort: 5554
{{- else }}
        - name: http
          containerPort: 5556
{{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/dex/config
{{- if and .Values.internalTls.enabled .Values.internalTls.dex }}
        - name: internal-tls
          mountPath: /etc/dex/tls
          readOnly: true
{{- end }}
        # Gate readiness on a real signing key, not just the HTTP server binding.
        # /dex/healthz returns 200 as soon as the server binds — before the first
        # key rotation — so a pod can go Ready while /dex/keys serves an empty JWKS.
        # The EKS OIDC authenticator would then fetch and cache that empty key set
        # and 401 every id_token until its webhook cache TTL expires (see #82).
        # Staying NotReady until a "kid" appears keeps the pod out of the Service
        # endpoints so the authenticator retries instead of caching a keyless set.
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - 'wget -q -O - http://127.0.0.1:5556/dex/keys | grep -q "\"kid\""'
          periodSeconds: {{ .Values.dex.keyCheck.period_seconds }}
          # failureThreshold = timeout / period. keyCheck bounds are validated in
          # validations.tpl; max 1 only keeps this from dividing by zero so that
          # guard produces the error rather than a raw template panic.
          failureThreshold: {{ div (.Values.dex.keyCheck.timeout_seconds | int) (max 1 (.Values.dex.keyCheck.period_seconds | int)) }}
{{- if and .Values.internalTls.enabled .Values.internalTls.dex }}
        # Probe the localhost-only plaintext listener rather than the TLS port: the
        # network-facing port is HTTPS and kubelet would not verify its certificate
        # anyway, so this keeps the probes simple and the TLS port for real traffic.
        readinessProbe:
          exec:
            command: ["sh", "-c", "wget -q -O - http://127.0.0.1:5556/dex/healthz"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "wget -q -O - http://127.0.0.1:5556/dex/healthz"]
          initialDelaySeconds: 15
          periodSeconds: 20
{{- else }}
        readinessProbe:
          httpGet:
            path: /dex/healthz
            port: 5556
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /dex/healthz
            port: 5556
          initialDelaySeconds: 15
          periodSeconds: 20
{{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
      volumes:
      - name: config
        configMap:
          name: dex-config
          items:
          - key: config.yaml
            path: config.yaml
{{- if and .Values.internalTls.enabled .Values.internalTls.dex }}
      - name: internal-tls
        secret:
          secretName: dex-internal-tls
{{- end }}