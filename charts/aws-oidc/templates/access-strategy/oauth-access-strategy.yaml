{{- if .Values.accessStrategy.createOAuth }}
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceAccessStrategy
metadata:
  name: oauth-access-strategy
  namespace: {{ .Values.accessStrategy.namespace }}
spec:
  displayName: JupyterLab Routing Strategy with GitHub authentication
  {{- if .Values.accessStrategy.webSocket.enabled }}
  createConnectionHandler: "k8s-native"
  {{- end }}
  accessResourceTemplates:
    {{- if .Values.accessStrategy.createNetworkPolicy }}
    - kind: NetworkPolicy
      apiVersion: networking.k8s.io/v1
      namePrefix: workspace-network-policy
      template: |
        spec:
          podSelector:
            matchLabels:
              workspace.jupyter.org/workspaceName: "{{`{{ .Workspace.Name }}`}}"
          policyTypes:
          - Ingress
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ .Values.namespace }}
              podSelector:
                matchLabels:
                  app: traefik
                  component: router
            ports:
            - port: 8888
              protocol: TCP
            {{- if .Values.accessStrategy.webSocket.enabled }}
            {{- include "awsOidc.webSocket.netpolPort" . | nindent 12 }}
            {{- end }}
          - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: jupyter-k8s-system
            ports:
            - port: 8888
              protocol: TCP
            {{- if .Values.accessStrategy.webSocket.enabled }}
            {{- include "awsOidc.webSocket.netpolPort" . | nindent 12 }}
            {{- end }}
    {{- end }}
    - kind: IngressRoute
      apiVersion: traefik.io/v1alpha1
      namePrefix: authorized-route
      template: |
        spec:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`{{ .Values.domain }}`) && PathPrefix(`/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/`)"
              kind: Rule
              priority: 100
              middlewares:
                - name: compress
                  namespace: {{ .Values.namespace }}
                - name: auth-headers
                  namespace: {{ .Values.namespace }}
                - name: authmiddleware-verify
                  namespace: {{ .Values.namespace }}
              services:
                - name: "{{`{{ .Service.Name }}`}}"
                  namespace: "{{`{{ .Service.Namespace }}`}}"
                  port: 8888
    - kind: IngressRoute
      apiVersion: traefik.io/v1alpha1
      namePrefix: unauthorized-route
      template: |
        spec:
          entryPoints:
            - websecure
          routes:
            - match: "Host(`{{ .Values.domain }}`) && PathPrefix(`/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/auth`)"
              kind: Rule
              priority: 110
              middlewares:
                - name: compress
                  namespace: {{ .Values.namespace }}
                - name: auth-headers
                  namespace: {{ .Values.namespace }}
                - name: oauth-auth-redirect
                  namespace: {{ .Values.namespace }}
                - name: authmiddleware-auth
                  namespace: {{ .Values.namespace }}
                - name: strip-auth-suffix
                  namespace: {{ .Values.namespace }}
              services:
                - name: "{{`{{ .Service.Name }}`}}"
                  namespace: "{{`{{ .Service.Namespace }}`}}"
                  port: 8888
    {{- if .Values.accessStrategy.webSocket.enabled }}
    {{- include "awsOidc.webSocket.ingressRoute" . | nindent 4 }}
    {{- end }}
  deploymentModifications:
    podModifications:
      {{- if .Values.accessStrategy.webSocket.enabled }}
      {{- include "awsOidc.webSocket.podModifications" . | nindent 6 }}
      {{- end }}
      primaryContainerModifications:
        mergeEnv:
          - name: JUPYTER_BASE_URL
            valueTemplate: "/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/"
          {{- if .Values.accessStrategy.webSocket.enabled }}
          - name: REMOTE_ACCESS_AUTOSTART
            valueTemplate: "true"
          {{- end }}
          {{- if and .Values.accessStrategy.webSocket.enabled .Values.accessStrategy.webSocket.hostKeyPath }}
          - name: SSH_HOST_KEY_PATH
            valueTemplate: {{ .Values.accessStrategy.webSocket.hostKeyPath | quote }}
          {{- end }}
  applicationBasePathTemplate: "/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/"
  accessURLTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/auth"
  {{- if .Values.accessStrategy.webSocket.enabled }}
  webSocketURLTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/ssh-ws"
  {{- end }}
  accessStartupProbe:
    httpGet:
      urlTemplate: "https://{{ .Values.domain }}/workspaces/{{`{{ .Workspace.Namespace }}`}}/{{`{{ .Workspace.Name }}`}}/auth"
      additionalSuccessStatusCodes: [302]
    initialDelaySeconds: 1
    periodSeconds: 2
    failureThreshold: 20
{{- end }}
