{{- if .Values.webApp.enabled }}
# ServiceAccount for the web-app pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-app
  namespace: {{ .Values.namespace }}
  labels:
    app: web-app
    component: web-app
---
# Role for reading session signing keys (secret watch for key rotation)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-app-session-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: web-app
    component: security
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.webApp.session.secretName }}"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-app-session-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: web-app
    component: security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-app-session-reader
subjects:
  - kind: ServiceAccount
    name: web-app
    namespace: {{ .Values.namespace }}
---
# ClusterRole for namespace discovery (label-based workspace namespace list).
# list only — the server polls listNamespace() on an interval (not a watch),
# and makes no per-namespace get.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-web-app-namespace-discovery
  labels:
    app: web-app
    component: web-app
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-web-app-namespace-discovery
  labels:
    app: web-app
    component: web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.namespace }}-web-app-namespace-discovery
subjects:
  - kind: ServiceAccount
    name: web-app
    namespace: {{ .Values.namespace }}
---
# ClusterRole for live CRD schema reading (YAML editor validation).
# get, scoped by resourceNames to exactly the three CRDs the editor reads
# (mirrors CRD_REGISTRY in jupyter-k8s-ui server/schema/store.ts). If the UI
# adds a fourth CRD, this list must be updated in lockstep.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-web-app-crd-reader
  labels:
    app: web-app
    component: web-app
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - workspaces.workspace.jupyter.org
      - workspacetemplates.workspace.jupyter.org
      - workspaceaccessstrategies.workspace.jupyter.org
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-web-app-crd-reader
  labels:
    app: web-app
    component: web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.namespace }}-web-app-crd-reader
subjects:
  - kind: ServiceAccount
    name: web-app
    namespace: {{ .Values.namespace }}
{{- end }}
