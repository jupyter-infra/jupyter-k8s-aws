{{- if .Values.storageClass.ebs.create }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.ebs.name }}
  labels:
    app.kubernetes.io/name: jupyter-k8s-aws-oidc
  {{- if .Values.storageClass.ebs.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ .Values.storageClass.ebs.provisioner }}
parameters:
  {{- with .Values.storageClass.ebs.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- /* Sorted so the numbering, and with it the immutable parameters, is stable across upgrades. */}}
  {{- $tags := .Values.storageClass.ebs.additionalResourceTags }}
  {{- range $i, $k := keys $tags | sortAlpha }}
  tagSpecification_{{ add1 $i }}: {{ printf "%s=%s" $k (get $tags $k | toString) | quote }}
  {{- end }}
reclaimPolicy: {{ .Values.storageClass.ebs.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClass.ebs.volumeBindingMode }}
---
{{- end }}